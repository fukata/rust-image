<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./logo.png" />
    <title>Image Resizer</title>
    <script defer src="./alpine.js"></script>
    <script type="module">
        import init from './pkg/rust_image.js';
        window.initWasm = init;
        
        // 初期表示時にトップにスクロールし、Service Workerを登録
        window.addEventListener('load', () => {
            window.scrollTo(0, 0);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker登録成功:', registration.scope);

                        // 更新チェック
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'activated') {
                                    if (!navigator.serviceWorker.controller) {
                                        return;
                                    }
                                    if (confirm('新しいバージョンが利用可能です。更新しますか？')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(error => {
                        console.log('ServiceWorker登録失敗:', error);
                    });
            }
        });
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
            min-height: 100vh;
            overflow-y: auto;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 1rem 1rem 5rem 1rem; /* Add bottom padding for tab bar */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .card {
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            box-shadow: 0 -2px 10px -2px rgb(0 0 0 / 0.1);
            z-index: 1000;
        }
        .tab-container {
            display: flex;
            max-width: 800px;
            width: 100%;
        }
        .tab {
            flex: 1;
            padding: 0.75rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #6b7280;
            font-weight: 500;
            background: none;
            border: none;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }
        .tab.active {
            color: #3b82f6;
            background-color: #f0f7ff;
        }
        .tab:hover {
            color: #3b82f6;
            background-color: #f9fafb;
        }
        .tab-icon {
            font-size: 1.25rem;
            line-height: 1;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            text-align: center;
        }
        .header img {
            width: 50px;
            height: 50px;
        }
        .header h1 {
            margin: 0;
            color: #1f2937;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }
        .btn {
            margin: 3px;
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
            width: auto;
        }
        .btn:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .file-field {
            margin-top: 1rem;
            margin-bottom: 3rem;
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            min-width: 0;
            flex: 1;
            justify-content: center;
            min-height: calc(100vh - 280px);
        }
        .file-field-button {
            margin-bottom: 0.5rem;
        }
        .file-field.dragover {
            border-color: #3b82f6;
            background-color: #f0f7ff;
            cursor: copy;
        }
        .file-field:hover {
            border-color: #3b82f6;
        }
        .file-path-wrapper {
            width: 100%;
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }
        .file-path {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.25rem;
            text-align: center;
            font-size: 0.875rem;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            background-color: #f9fafb;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }
        .image-container {
            background: #f9fafb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 0.25rem;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            margin: 1rem 0;
            font-size: 0.875rem;
            color: #4b5563;
            text-align: center;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #3b82f6;
            font-weight: 500;
            padding: 2rem;
            background: #f0f7ff;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
        .loading::after {
            content: "";
            width: 2rem;
            height: 2rem;
            border: 3px solid #3b82f6;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            font-size: 1.1rem;
        }
        .processing-details {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        [x-cloak] { display: none !important; }
        .resize-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            border-radius: 0.25rem;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            margin-bottom: 1rem;
        }
        @media (min-width: 768px) {
            .container {
                padding: 2rem 2rem 5rem 2rem;
            }
            .card {
                padding: 2rem;
            }
            .stats {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            .btn {
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
            }
            .file-path {
                font-size: 1rem;
            }
            .file-field {
                padding: 2.5rem 2rem;
                gap: 1.5rem;
            }
            .tab {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
            .tab-icon {
                font-size: 1.5rem;
            }
        }
        @media (min-width: 768px) {
            .file-field {
                padding: 2rem;
                margin-top: 2rem;
                margin-bottom: 3rem;
            }
        }
        .offline-notice {
            background-color: #fef2f2;
            color: #991b1b;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }
        .offline-notice.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container" x-data="imageResizer">
        <div class="header">
            <img src="./logo.png" alt="Logo">
            <h1>Image Resizer</h1>
        </div>

        <div class="offline-notice" id="offlineNotice">
            オフラインモードで動作中です
        </div>

        <div class="card">
            <!-- Home Tab Content -->
            <div class="tab-content" :class="{ 'active': activeTab === 'home' }">
                <div class="file-field" 
                     @dragover.prevent="dragOver = true"
                     @dragleave.prevent="dragOver = false"
                     @drop.prevent="handleDrop($event)"
                     @click="document.getElementById('fileInput').click()"
                     :class="{ 'dragover': dragOver }">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" @change="handleFileSelect">
                    <div class="file-field-button">
                        <span class="btn">選択 または ドラッグ＆ドロップ</span>
                    </div>
                    <div class="file-path-wrapper" x-show="fileName" x-cloak>
                        <input class="file-path" type="text" x-model="fileName" readonly>
                    </div>
                </div>

                <template x-if="isOriginalLoading">
                    <div class="loading">画像を読み込み中...</div>
                </template>

                <div x-show="showOriginal" x-cloak id="original-section">
                    <h2>元の画像</h2>
                    <div class="image-container">
                        <img id="originalImage" :src="originalImageUrl || ''" alt="Original Image">
                        <div class="stats">
                            <p><span x-text="originalDimensions || ''"></span></p>
                            <p><span x-text="originalFileSize || ''"></span></p>
                            <p><span x-text="originalProcessTime || ''"></span></p>
                        </div>
                    </div>

                    <div class="resize-controls">
                        <button class="btn" @click="resizeImage(0.25)">25%</button>
                        <button class="btn" @click="resizeImage(0.5)">50%</button>
                        <button class="btn" @click="resizeImage(0.75)">75%</button>
                    </div>
                </div>

                <template x-if="isResizing">
                    <div class="loading" id="resizing-section">
                        <div>
                            <div class="loading-text">画像をリサイズしています...</div>
                            <div class="processing-details">
                                <div>元のサイズ: <span x-text="originalDimensions"></span></div>
                                <div>処理中のファイル: <span x-text="fileName"></span></div>
                            </div>
                        </div>
                    </div>
                </template>

                <div x-show="showResized" x-cloak id="resized-section">
                    <h2>リサイズされた画像</h2>
                    <div class="image-container">
                        <div>
                            <img id="resizedImage" :src="resizedImageUrl || ''" alt="Resized Image">
                            <div class="stats">
                                <p><span x-text="resizedDimensions || ''"></span></p>
                                <p><span x-text="resizedFileSize || ''"></span></p>
                                <p><span x-text="resizedProcessTime || ''"></span></p>
                            </div>
                        </div>
                    </div>
                    <div class="actions" x-show="showResized">
                        <button class="btn" @click="downloadResizedImage">ダウンロード</button>
                        <button class="btn" @click="shareResizedImage">共有</button>
                    </div>
                </div>
            </div>

            <!-- History Tab Content -->
            <div class="tab-content" :class="{ 'active': activeTab === 'history' }">
                <div class="history-header">
                    <h2>履歴</h2>
                    <button class="btn btn-danger" @click="clearHistory" x-show="history.length">履歴をクリア</button>
                </div>
                
                <div x-show="!history.length" class="loading" style="background: #f9fafb; color: #6b7280;">
                    まだ履歴がありません
                </div>
                
                <div x-show="history.length" class="thumbnail-grid">
                    <template x-for="(item, index) in history" :key="index">
                        <img class="thumbnail" :src="item.dataUrl" alt="History Image" @click="openHistoryImage(index)">
                    </template>
                </div>
            </div>

            <!-- History Modal -->
            <div x-show="selectedHistoryIndex !== null" x-cloak class="modal" @click.self="closeHistoryImage">
                <div class="modal-content">
                    <img :src="selectedHistoryIndex !== null ? history[selectedHistoryIndex]?.dataUrl : ''" alt="History Image">
                    <div class="actions">
                        <button class="btn" @click="downloadHistoryImage(selectedHistoryIndex)">ダウンロード</button>
                        <button class="btn" @click="shareHistoryImage(selectedHistoryIndex)">共有</button>
                        <button class="btn btn-danger" @click="deleteHistoryItem(selectedHistoryIndex)">削除</button>
                        <button class="btn" @click="closeHistoryImage">閉じる</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Tab Bar -->
        <div class="tab-bar">
            <div class="tab-container">
                <button class="tab" :class="{ 'active': activeTab === 'home' }" @click="activeTab = 'home'">
                    <div class="tab-icon">🏠</div>
                    <div>ホーム</div>
                </button>
                <button class="tab" :class="{ 'active': activeTab === 'history' }" @click="activeTab = 'history'">
                    <div class="tab-icon">📂</div>
                    <div>履歴</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // オフライン状態の監視を追加
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function updateOnlineStatus() {
            const notice = document.getElementById('offlineNotice');
            if (!navigator.onLine) {
                notice.classList.add('show');
            } else {
                notice.classList.remove('show');
            }
        }

        // 初期状態のチェック
        updateOnlineStatus();

        document.addEventListener('alpine:init', () => {
            Alpine.data('imageResizer', () => ({
                activeTab: 'home',
                dragOver: false,
                fileName: '',
                originalImageUrl: null,
                resizedImageUrl: null,
                originalDimensions: '',
                originalFileSize: '',
                originalProcessTime: '',
                resizedDimensions: '',
                resizedFileSize: '',
                resizedProcessTime: '',
                isOriginalLoading: false,
                isResizing: false,
                showOriginal: false,
                showResized: false,
                originalImageData: null,
                originalFormat: '',
                originalImage: null,
                resizedBlob: null,
                resize_image: null,
                history: [],
                selectedHistoryIndex: null,

                async init() {
                    const wasm = await import('./pkg/rust_image.js');
                    await wasm.default();
                    this.resize_image = wasm.resize_image;
                    this.originalImage = document.getElementById('originalImage');
                    const stored = localStorage.getItem('resizeHistory');
                    if (stored) {
                        this.history = JSON.parse(stored);
                    }
                },

                handleFileSelect(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.processFile(file);
                    }
                },

                handleDrop(event) {
                    this.dragOver = false;
                    const file = event.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.processFile(file);
                    }
                },

                processFile(file) {
                    this.isOriginalLoading = true;
                    this.showOriginal = false;
                    this.showResized = false;

                    const startTime = performance.now();
                    this.fileName = file.name;
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        const originalImageData = e.target.result;
                        const originalImageDataBinary = atob(originalImageData.split(',')[1]);

                        this.originalImageUrl = originalImageData;
                        this.originalImage.onload = async () => {
                            this.originalImageData = Uint8Array.from(originalImageDataBinary.split(""), e => e.charCodeAt(0));
                            
                            this.originalDimensions = `Width: ${this.originalImage.naturalWidth}px, Height: ${this.originalImage.naturalHeight}px`;
                            this.originalFileSize = `File Size: ${(file.size / 1024).toFixed(2)} KB`;

                            const endTime = performance.now();
                            this.originalProcessTime = `Processed in ${(endTime - startTime).toFixed(2)} ms`;

                            this.isOriginalLoading = false;
                            this.showOriginal = true;

                            // DOMの更新を待ってスクロール
                            await new Promise(resolve => setTimeout(resolve, 0));
                            await new Promise(resolve => requestAnimationFrame(resolve));
                            
                            const originalSection = document.getElementById('original-section');
                            if (originalSection) {
                                originalSection.scrollIntoView({ behavior: 'smooth' });
                            }
                        };

                        const formatMatch = file.type.match(/image\/(png|jpeg|jpg|gif)/);
                        this.originalFormat = formatMatch ? formatMatch[1] : 'png';
                    };
                    reader.readAsDataURL(file);
                },

                async resizeImage(scale) {
                    if (!this.resize_image) return;
                    
                    this.isResizing = true;
                    this.showResized = false;
                    this.resizedDimensions = '';
                    this.resizedFileSize = '';
                    this.resizedProcessTime = '';

                    // 状態の更新が画面に反映されるのを待つ
                    await new Promise(resolve => requestAnimationFrame(resolve));

                    // リサイズ開始時のスクロール
                    document.getElementById('resizing-section').scrollIntoView({ behavior: 'smooth' });

                    const startTime = performance.now();
                    const newWidth = Math.floor(this.originalImage.naturalWidth * scale);
                    const newHeight = Math.floor(this.originalImage.naturalHeight * scale);
                    
                    try {
                        const resizedData = await new Promise((resolve, reject) => {
                            try {
                                setTimeout(() => {
                                    const result = this.resize_image(
                                        this.originalImageData,
                                        newWidth,
                                        newHeight,
                                        this.originalFormat
                                    );
                                    resolve(result);
                                }, 0);
                            } catch (error) {
                                reject(error);
                            }
                        });
                        
                        const mimeType = `image/${this.originalFormat}`;
                        const blob = new Blob([resizedData], { type: mimeType });
                        this.resizedBlob = blob;
                        const url = URL.createObjectURL(blob);
                        
                        this.resizedImageUrl = url;
                        this.resizedDimensions = `Width: ${newWidth}px, Height: ${newHeight}px`;
                        this.resizedFileSize = `File Size: ${(blob.size / 1024).toFixed(2)} KB`;
                        this.resizedProcessTime = `Processed in ${(performance.now() - startTime).toFixed(2)} ms`;

                        this.isResizing = false;
                        this.showResized = true;

                        this.addToHistory(blob);

                        // DOMの更新を確実に待つ
                        await new Promise(resolve => setTimeout(resolve, 0));
                        await new Promise(resolve => requestAnimationFrame(resolve));
                        
                        // スクロール実行
                        const resizedSection = document.getElementById('resized-section');
                        if (resizedSection) {
                            resizedSection.scrollIntoView({ behavior: 'smooth' });
                        }
                    } catch (error) {
                        console.error('リサイズ中にエラーが発生しました:', error);
                        this.isResizing = false;
                        alert('画像のリサイズ中にエラーが発生しました。');
                    }
                },

                downloadResizedImage() {
                    const link = document.createElement('a');
                    const fileNameParts = this.fileName.split('.');
                    const extension = fileNameParts.pop();
                    const baseName = fileNameParts.join('.');
                    link.download = `${baseName}_resized.${this.originalFormat}`;
                    link.href = this.resizedImageUrl;
                    link.click();
                },

                shareResizedImage() {
                    if (navigator.share) {
                        fetch(this.resizedImageUrl)
                            .then(response => response.blob())
                            .then(blob => {
                                const file = new File([blob], `${this.fileName.split('.')[0]}_resized.${this.originalFormat}`, 
                                    { type: `image/${this.originalFormat}` });
                                
                                navigator.share({
                                    files: [file],
                                    title: 'Resized Image',
                                    text: 'Check out this resized image!'
                                }).catch(error => console.error('Error sharing:', error));
                            })
                            .catch(error => {
                                console.error('Error creating file for sharing:', error);
                                alert('共有の準備中にエラーが発生しました。');
                            });
                    } else {
                        alert('お使いのブラウザは共有機能に対応していません。');
                    }
                },

                addToHistory(blob) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const dataUrl = reader.result;
                        const fileNameParts = this.fileName.split('.');
                        fileNameParts.pop();
                        const baseName = fileNameParts.join('.');
                        const item = {
                            dataUrl,
                            fileName: `${baseName}_resized.${this.originalFormat}`,
                            format: this.originalFormat
                        };
                        this.history.unshift(item);
                        if (this.history.length > 10) {
                            this.history.pop();
                        }
                        localStorage.setItem('resizeHistory', JSON.stringify(this.history));
                    };
                    reader.readAsDataURL(blob);
                },

                openHistoryImage(index) {
                    this.selectedHistoryIndex = index;
                },

                closeHistoryImage() {
                    this.selectedHistoryIndex = null;
                },

                downloadHistoryImage(index) {
                    const item = this.history[index];
                    const link = document.createElement('a');
                    link.download = item.fileName;
                    link.href = item.dataUrl;
                    link.click();
                },

                shareHistoryImage(index) {
                    const item = this.history[index];
                    if (navigator.share) {
                        fetch(item.dataUrl)
                            .then(response => response.blob())
                            .then(blob => {
                                const file = new File([blob], item.fileName, { type: `image/${item.format}` });
                                navigator.share({
                                    files: [file],
                                    title: 'Resized Image',
                                    text: 'Check out this resized image!'
                                }).catch(error => console.error('Error sharing:', error));
                            })
                            .catch(error => {
                                console.error('Error creating file for sharing:', error);
                                alert('共有の準備中にエラーが発生しました。');
                            });
                    } else {
                        alert('お使いのブラウザは共有機能に対応していません。');
                    }
                },

                deleteHistoryItem(index) {
                    if (confirm('この履歴を削除しますか？')) {
                        this.history.splice(index, 1);
                        localStorage.setItem('resizeHistory', JSON.stringify(this.history));
                        this.closeHistoryImage();
                    }
                },

                clearHistory() {
                    if (confirm('履歴を全て削除しますか？')) {
                        this.history = [];
                        localStorage.removeItem('resizeHistory');
                        this.selectedHistoryIndex = null;
                    }
                }
            }))
        });
    </script>
</body>
</html>
